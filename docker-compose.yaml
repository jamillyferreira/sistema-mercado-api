# docker-compose.yaml
name: sistema-mercado
services:
  postgres:
    image: postgres:18-alpine
    container_name: sistema-mercado-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - sistema-mercado-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  db-data:
    name: sistema-mercado-db-data
networks:
  sistema-mercado-net:
    name: sistema-mercado-network
# application-dev.yaml
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}  # pela IDE a app está fora do Docker
  jpa:
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 120
  issuer: sistema-mercado-api
springdoc:
  api-docs:
    enabled: true
scalar:
  enabled: true
  theme: purple
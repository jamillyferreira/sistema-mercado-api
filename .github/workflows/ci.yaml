name: CI - Build and Test

# Gatilhos -> Define quando esse workflow deve rodar
on:
  # RODA sempre que alguem enviar código diretamente para as branches main ou develop
  push:
    branches: [ "main", "develop" ]
  # Roda sempre que alguém abrir/atualizar um PR para as branches main ou develop.
  pull_request:
    branches: [ "main", "develop" ]

# Trabalhos -> Um workflow pode ter varios jobs, aqui temos somente um chamado build
jobs:
  build:
    runs-on: ubuntu-latest

    # Passos -> Sequencia do que vai ser feito naquela maquina
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify --file pom.xml